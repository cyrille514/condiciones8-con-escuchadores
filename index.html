<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piedra, Papel o Tijera</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @layer base {
            :root {
                @apply text-sm;
                line-height: 1.5;
            }
        }
    </style>
</head>
<body class="bg-[url('img.jpg')] bg-cover bg-center bg-no-repeat w-full h-96
 flex justify-center items-center h-screen font-sans">

<div class="bg-white p-8 rounded-xl shadow-lg text-center max-w-sm w-full mx-4">
    <h2 class="text-xl font-bold text-gray-800 mb-4">Jugar a piedra, papel o tijera:</h2>
    
    <div class="text-left space-y-1 mb-4 text-gray-700 font-medium">
        <p>👊 1. Piedra</p>
        <p>✋ 2. Papel</p>
        <p>✌ 3. Tijera</p>
    </div>
    
    <div class="flex flex-col items-center gap-2 mb-4">
        <label class="text-gray-600 font-medium">Tu elección (1-3):</label>
        <input type="number" id="eleccionUsuario" min="1" max="3" placeholder="Ej: 1" 
               class="border border-gray-300 rounded-lg px-3 py-2 w-full text-center focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    
    <button type="button" id="btnJugar" 
            class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg transition duration-200 w-full cursor-pointer">
        ¡Jugamos!
    </button>
    
    <p id="resultado" class="mt-5 font-bold text-lg text-gray-800 min-h-[1.5rem]"></p>
</div>

<script src="./js/app.js"></script>
</body>
</html>
